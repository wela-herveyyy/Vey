name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer\vey.iss
      - name: Name the no-install version clearly
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item target\release\vey.exe "Vey-portable-$v.exe"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/VeySetup-*.exe
            Vey-portable-*.exe
          body: |
            **Most people: download `VeySetup-...exe` (the installer).** It adds Vey to the Start menu, can start with Windows, and updates itself from the tray menu.

            **Don't want to install? Use `Vey-portable-...exe`.** Put it in a folder you'll keep and run it. No Start menu entry beyond the one Vey adds itself, and it can update itself from the tray menu too.

            **Linux (preview): use `vey_...amd64.deb` or `vey-...-x86_64-linux.tar.gz`.** Needs an X11 session (or XWayland) and the DejaVu Sans font. The `.deb` installs with `sudo apt install ./vey_...amd64.deb`; the tarball installs for your user with `./install.sh`. It is a preview, with fewer features and far less testing than the Windows version. See the README for what is missing.
          generate_release_notes: true

  # Linux preview packages join the release the Windows job created.
  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Build packages
        run: packaging/linux/package.sh "${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/linux/out/vey_*_amd64.deb
            packaging/linux/out/vey-*-x86_64-linux.tar.gz
